name: Keepalive

# GitHub disables scheduled workflows in a public repo after 60 days without
# repository activity, and the off-season can pass that with no fixture
# commits. Re-enabling the workflows through the API resets the clock without
# a dummy commit (the same approach as gautamkrishnar/keepalive-workflow).
on:
  schedule:
    - cron: '37 1 1 * *'   # 1st of each month, ~11:37 AEST
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deliberately not weekend-summary.yml, which is disabled on purpose.
          for wf in update-fixtures.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "Re-enabled $wf"
          done

      - name: Alert on failure
        if: failure()
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC_HEARTBEAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOPIC" ]; then echo "::error::NTFY_TOPIC_HEARTBEAT is not set"; exit 1; fi
          curl -fsS -H "Title: Fixtures keepalive failed" \
               -H "Tags: warning" \
               -H "Click: $RUN_URL" \
               -d "Keepalive run failed; scheduled workflows may get disabled. $RUN_URL" \
               "ntfy.sh/$TOPIC"
