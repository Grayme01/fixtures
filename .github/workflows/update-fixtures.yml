name: Update fixtures

on:
  schedule:
    # Times are UTC. Sydney is UTC+10 (AEST, winter) / UTC+11 (AEDT, summer).
    # Tuned to AEST since the soccer season runs through winter;
    # during AEDT (~Oct–Apr) these fire 1h later than the labels say.
    - cron: '13 0 * * 1-5'    # Mon–Fri ~10:13 AEST (00:13 UTC) — minute offset reduces top-of-hour queue drift
    - cron: '13 22 * * 5,6'   # Sat–Sun ~08:13 AEST (22:13 UTC Fri–Sat)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50   # enough for a 7-day commit lookback (heartbeat step)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install curl_cffi

      # No teams active: the 2026 winter season has ended. Burwood 45 05,
      # Burwood 45 03 and Easts PISA were archived. Their .ics files stay frozen
      # at the same Pages URLs so subscribers keep the season's history. The
      # per-team Snapshot/Generate/Diff/Commit/Notify blocks are kept in the
      # `season-2026` tag; copy one from there to add a team.

      # --- Weekly heartbeat ---
      # Fires only on scheduled Thursday runs, and only if no auto-commits
      # have landed in the past 7 days. Sends to a dedicated topic so other
      # team subscribers don't see the weekly noise.
      - name: Weekly heartbeat (Thursday, quiet week)
        if: github.event_name == 'schedule'
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC_HEARTBEAT }}
        run: |
          if [ "$(date -u +%u)" != "4" ]; then
            echo "Not Thursday (UTC) — skipping heartbeat."
            exit 0
          fi
          # An unset secret used to make curl post to bare ntfy.sh/, get a 400, and
          # still exit 0. Fail loudly instead.
          if [ -z "$TOPIC" ]; then echo "::error::NTFY_TOPIC_HEARTBEAT is not set"; exit 1; fi
          count=$(git log --since="7 days ago" --author="github-actions" --oneline | wc -l)
          echo "Auto-commits in last 7 days: $count"
          if [ "$count" -gt 0 ]; then
            echo "Updates happened this week; no heartbeat needed."
            exit 0
          fi
          last_run_utc=$(date -u +"%Y-%m-%d %H:%M UTC")
          curl -fsS -H "Title: Fixtures system: weekly check-in" \
               -H "Tags: heartbeat,white_check_mark" \
               -d "All quiet. The daily check ran today and there have been no fixture changes in the past 7 days. Last run: $last_run_utc." \
               "ntfy.sh/$TOPIC"

