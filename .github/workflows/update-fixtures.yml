name: Update fixtures

on:
  schedule:
    # Times are UTC. Sydney is UTC+10 (AEST, winter) / UTC+11 (AEDT, summer).
    # Tuned to AEST since the soccer season runs through winter;
    # during AEDT (~Oct–Apr) these fire 1h later than the labels say.
    - cron: '13 0 * * 1-5'    # Mon–Fri ~10:13 AEST (00:13 UTC) — minute offset reduces top-of-hour queue drift
    - cron: '13 22 * * 5,6'   # Sat–Sun ~08:13 AEST (22:13 UTC Fri–Sat)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50   # enough for a 7-day commit lookback (heartbeat step)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install curl_cffi

      # Burwood 45 05, Burwood 45 03 and Easts PISA (2026 winter) are archived:
      # their .ics files stay frozen at the same Pages URLs, and their workflow
      # steps are kept in the `season-2026` tag.

      # --- Marrickville F5s O45: Coventry City FC ---
      - name: Snapshot Marrickville O45 (HEAD)
        run: |
          git show HEAD:marrickville_o45.ics > /tmp/old_marrickville_o45.ics 2>/dev/null || : > /tmp/old_marrickville_o45.ics

      - name: Generate Marrickville O45
        run: |
          python3 dribl_to_ics.py \
            --tenant pAnmYMzmzG \
            --season XRNErWXKva \
            --club yBjmaBqNRq \
            --competition V8dnlqBoNw \
            --team WdgpR1DomR \
            --calname "Coventry City FC (Marrickville O45 F5s)" \
            --match-url-base "https://marrickvillefc.dribl.com/matchcentre?m=" \
            --strip-team-prefix "Marrickville Over 45 Men " \
            --duration 45 \
            --out marrickville_o45.ics

      - name: Diff Marrickville O45
        id: diff_marrickville_o45
        run: |
          if [ -s /tmp/old_marrickville_o45.ics ]; then
            grep -v '^DTSTAMP' /tmp/old_marrickville_o45.ics > /tmp/old_clean
            grep -v '^DTSTAMP' marrickville_o45.ics > /tmp/new_clean
            if diff -q /tmp/old_clean /tmp/new_clean > /dev/null; then
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          body=$(python3 diff_ics.py --old /tmp/old_marrickville_o45.ics --new marrickville_o45.ics)
          if [ -z "$body" ]; then
            echo "notify=false" >> $GITHUB_OUTPUT
          else
            echo "notify=true" >> $GITHUB_OUTPUT
            delim=$(openssl rand -hex 12)
            {
              echo "body<<$delim"
              echo "$body"
              echo "$delim"
            } >> $GITHUB_OUTPUT
          fi

      # --- Commit + notify ---
      - name: Commit if any team's .ics changed
        if: steps.diff_marrickville_o45.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add marrickville_o45.ics
          git commit -m "Update fixtures $(date -u +%Y-%m-%d)"
          git push

      - name: Notify Marrickville O45 subscribers
        if: steps.diff_marrickville_o45.outputs.notify == 'true'
        env:
          BODY: ${{ steps.diff_marrickville_o45.outputs.body }}
          TOPIC: ${{ secrets.NTFY_TOPIC_MARRICKVILLE }}
        run: |
          # Plain curl exits 0 on an ntfy 400, so an unset secret would pass silently.
          if [ -z "$TOPIC" ]; then echo "::error::NTFY_TOPIC_MARRICKVILLE is not set"; exit 1; fi
          curl -fsS -H "Title: Coventry City FC (O45 F5s) fixtures updated" \
               -H "Tags: soccer" \
               --data-binary "$BODY" \
               "ntfy.sh/$TOPIC"

      # --- Weekly heartbeat ---
      # Fires only on scheduled Thursday runs, and only if no auto-commits
      # have landed in the past 7 days. Sends to a dedicated topic so other
      # team subscribers don't see the weekly noise.
      - name: Weekly heartbeat (Thursday, quiet week)
        if: github.event_name == 'schedule'
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC_HEARTBEAT }}
        run: |
          if [ "$(date -u +%u)" != "4" ]; then
            echo "Not Thursday (UTC) — skipping heartbeat."
            exit 0
          fi
          # An unset secret used to make curl post to bare ntfy.sh/, get a 400, and
          # still exit 0. Fail loudly instead.
          if [ -z "$TOPIC" ]; then echo "::error::NTFY_TOPIC_HEARTBEAT is not set"; exit 1; fi
          count=$(git log --since="7 days ago" --author="github-actions" --oneline | wc -l)
          echo "Auto-commits in last 7 days: $count"
          if [ "$count" -gt 0 ]; then
            echo "Updates happened this week; no heartbeat needed."
            exit 0
          fi
          last_run_utc=$(date -u +"%Y-%m-%d %H:%M UTC")
          curl -fsS -H "Title: Fixtures system: weekly check-in" \
               -H "Tags: heartbeat,white_check_mark" \
               -d "All quiet. The daily check ran today and there have been no fixture changes in the past 7 days. Last run: $last_run_utc." \
               "ntfy.sh/$TOPIC"

      - name: Alert on failure
        if: failure()
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC_HEARTBEAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOPIC" ]; then echo "::error::NTFY_TOPIC_HEARTBEAT is not set"; exit 1; fi
          curl -fsS -H "Title: Fixtures workflow failed" \
               -H "Tags: warning" \
               -H "Click: $RUN_URL" \
               -d "Update fixtures run failed (trigger: $GITHUB_EVENT_NAME). $RUN_URL" \
               "ntfy.sh/$TOPIC"
